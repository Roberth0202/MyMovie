{% extends "base/reset_base.html" %}
{% load static %}

{% block reset %}

<div class="reset-password-container">
    {% if validlink %}
    <form method="post" class="reset-form">
        {% csrf_token %}

        <p>
            <label for="{{ form.new_password1.id_for_label }}">Nova senha:</label>
            {{ form.new_password1 }}
        </p>

        <p>
            <label for="{{ form.new_password2.id_for_label }}">Confirme a nova senha:</label>
            {{ form.new_password2 }}
        </p>

        <button type="submit">Redefinir</button>
    </form>
    {% else %}
    <p>O link de redefinição de senha é inválido ou já foi utilizado.</p>
    {% endif %}
</div>

{% endblock %}

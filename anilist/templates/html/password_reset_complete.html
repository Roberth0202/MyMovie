{% extends "base/reset_base.html" %}

{% load static %}
{% block reset %}

<div class="container-complete">
    <div class="sucess-reset">
        <img class="key" src="{% static 'img/key.svg' %}" alt="">

        <h1>Senha alterada!</h1>

        <img class="lock" src="{% static 'img/lock.svg' %}" alt="">
    </div>
    <div class="retorn-login">
        <p>Sua senha foi alterada com sucesso!</p>
        <a href="{% url 'login' %}">Voltar para o login</a>
    </div>
</div>

{% endblock %}

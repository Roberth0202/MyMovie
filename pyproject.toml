[project]
name = "mymovie"
version = "0.1.0"
description = "Projeto Django com dependências modernas"
authors = [
  { name = "Roberth" }
]
dependencies = [
  "asgiref==3.8.1",
  "build==1.2.2.post1",
  "certifi==2024.8.30",
  "charset-normalizer==3.4.0",
  "click==8.1.8",
  "colorama==0.4.6",
  "Django==5.1.2",
  "idna==3.10",
  "packaging==24.2",
  "pip-check==2.9",
  "pip-tools==7.4.1",
  "pyproject_hooks==1.2.0",
  "python-decouple==3.8",
  "requests==2.32.3",
  "setuptools==77.0.3",
  "sqlparse==0.5.1",
  "terminaltables==3.1.10",
  "tzdata==2024.2",
  "urllib3==2.2.3",
  "wheel==0.45.1"
]

[build-system]
requires = ["uv"]
build-backend = "uv.build"

[tool.uv]
python = "3.13"

{% extends "base/reset_base.html" %}
{% load static %}
{% block reset %}

<div class="email-reset-container">
    <h2>Redefinir Senha</h2>
    <form method="post" class="form-reset">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="redefinir">Enviar e-mail</button>
    </form>
</div>
{% endblock %}
